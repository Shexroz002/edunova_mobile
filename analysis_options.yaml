analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    require_trailing_commas: false

# The codebase is written at 100 columns; without this `dart format` would
# reflow files to its 80-column default.
formatter:
  page_width: 100
